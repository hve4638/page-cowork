services:
  cowork:
    build: .
    ports:
      - "8080:8771"            # 호스트:컨테이너. 리버스 프록시 뒤에 둘 때는 127.0.0.1:8080:8771 로 좁힌다
    volumes:
      - cowork-data:/data      # cowork.db · files/ · recordings/ · whitelist.txt
    environment:
      # DEV_AUTO_LOGIN: admin  # 세션 없는 요청을 이 사용자로 취급 (개발·데모 전용)
      TZ: Asia/Seoul
    restart: unless-stopped

volumes:
  cowork-data:
