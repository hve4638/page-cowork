# 배포 디렉터리 루트에 docker-compose.yml 로 복사해 쓴다. 이 파일은 사용자 소유다.
# 저장소는 같은 디렉터리의 source/ 에 clone 되어 있어야 한다 (README 참조).
include:
  - path:
      - source/deploy/partials/compose.base.yml
    project_directory: .

services:
  cowork:
    container_name: cowork
    ports:
      - "8080:8771"            # 호스트:컨테이너. 리버스 프록시 뒤에 둘 때는 127.0.0.1:8080:8771 로 좁힌다
    volumes:
      - /nas/storage1/.volume/cowork:/data   # cowork.db · files/ · recordings/ · whitelist.txt · admin.txt
    # environment:
    #   DEV_AUTO_LOGIN: admin@example.com  # 세션 없는 요청을 이 이메일의 사용자로 취급 (개발·데모 전용)
    #   DEV_ADMIN_EMAIL: admin@example.com # 기동 시 이 계정이 없으면 만들고 admin.txt 에 없어도 관리자로 취급 (테스트용)
    #   DEV_ADMIN_PW: change-me            # 위 계정의 비밀번호. 이미 있는 계정이면 바꾸지 않는다
    #   # AI 회의 노트: 이미지 안의 config.json 에는 키를 넣지 않는다. 실제 서비스를 쓸 때만 여기에 적는다
    #   STT_PROVIDER: speechmatics
    #   STT_API_KEY: ${STT_API_KEY}         # 값은 배포 디렉터리의 .env 에 두고 저장소에 올리지 않는다
    #   LLM_PROVIDER: chat
    #   LLM_BASE_URL: http://my-agent:8080/v1
    #   LLM_API_KEY: ${LLM_API_KEY}
    #   LLM_MODEL: my-model
    #   LLM_MODELS: my-model=기본,other-model=큰 모델   # 노트에서 골라 쓸 요약 모델 목록
