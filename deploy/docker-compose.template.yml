# 배포 디렉터리 루트에 docker-compose.yml 로 복사해 쓴다. 이 파일은 사용자 소유다.
# 저장소는 같은 디렉터리의 source/ 에 clone 되어 있어야 한다 (README 참조).
# 키·주소·모델 같은 환경별 값은 같은 디렉터리의 .env 에 둔다 (본보기: source/deploy/.env.template).
# .env 는 partial 이 env_file 로 통째로 컨테이너에 넘기므로 여기에는 포트·볼륨만 적는다.
include:
  - path:
      - source/deploy/partials/compose.base.yml
    project_directory: .

services:
  cowork:
    container_name: cowork
    ports:
      - "${COWORK_PORT:-80}:${COWORK_PORT:-80}"  # 호스트:컨테이너. 같은 값을 쓴다. 리버스 프록시 뒤에 둘 때는 127.0.0.1:${COWORK_PORT:-80}:${COWORK_PORT:-80} 로 좁힌다
    volumes:
      - ${COWORK_DATA:-./data}:/data           # cowork.db · files/ · recordings/ · whitelist.txt · admin.txt
