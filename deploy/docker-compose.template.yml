# 배포 디렉터리 루트에 docker-compose.yml 로 복사해 쓴다. 이 파일은 사용자 소유다.
# 저장소는 같은 디렉터리의 source/ 에 clone 되어 있어야 한다 (README 참조).
# 키·주소·모델 같은 환경별 값은 같은 디렉터리의 .env 에 둔다 (본보기: source/deploy/.env.template).
include:
  - path:
      - source/deploy/partials/compose.base.yml
    project_directory: .

services:
  cowork:
    container_name: cowork
    ports:
      - "${COWORK_PORT:-8080}:8771"            # 호스트:컨테이너. 리버스 프록시 뒤에 둘 때는 127.0.0.1:${COWORK_PORT:-8080}:8771 로 좁힌다
    volumes:
      - ${COWORK_DATA:-./data}:/data           # cowork.db · files/ · recordings/ · whitelist.txt · admin.txt
    environment:
      # AI 회의 노트. 이미지 안의 config.json 에는 키를 넣지 않고 .env 값을 그대로 넘긴다. 비어 있으면 서버가 mock 으로 기동한다
      STT_PROVIDER: ${STT_PROVIDER}
      STT_API_KEY: ${STT_API_KEY}
      STT_BASE_URL: ${STT_BASE_URL}
      STT_LIVE_URL: ${STT_LIVE_URL}
      STT_LANGUAGE: ${STT_LANGUAGE}
      LLM_PROVIDER: ${LLM_PROVIDER}
      LLM_API_KEY: ${LLM_API_KEY}
      LLM_BASE_URL: ${LLM_BASE_URL}
      LLM_MODEL: ${LLM_MODEL}
      LLM_MODELS: ${LLM_MODELS}
      # 개발·데모 전용. .env 에서 주석을 풀어야 값이 들어간다
      DEV_AUTO_LOGIN: ${DEV_AUTO_LOGIN}
      DEV_ADMIN_EMAIL: ${DEV_ADMIN_EMAIL}
      DEV_ADMIN_PW: ${DEV_ADMIN_PW}
      DEV_ADMIN_NAME: ${DEV_ADMIN_NAME}
